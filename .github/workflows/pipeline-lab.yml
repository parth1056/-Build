name: Two-app pipeline lab
on:
  push:
    branches: [main, codex/two-app-fresh-demo]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: two-app-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test the coordinator and the honest-control contract
        run: npm test
      - uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5
        with:
          version: v28.0.4
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .lab/custom-cache
          key: two-app-buildkit-v1-${{ runner.os }}-${{ hashFiles('engine/toolchain.json', 'apps/*/package-lock.json') }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            two-app-buildkit-v1-${{ runner.os }}-${{ hashFiles('engine/toolchain.json', 'apps/*/package-lock.json') }}-
      - name: Build both apps, run fresh parallel checks and verify their images
        run: npm run ci
      - name: Retain actual CI logs, snapshots and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: two-app-evidence-${{ github.run_id }}
          path: .lab/custom-evidence/
          include-hidden-files: true
          retention-days: 14
